<sly data-sly-use.license="com.adobe.aem.commons.assetshare.components.actions.license.License"></sly>

<!--/*
<style data-sly-test="${!wccmode.disabled}"></style>
*/-->

<sp-dialog-wrapper
        open
        slot="click-content"
        underlay
        placement="none"
        headline="${properties['modalTitle'] @ i18n}"
        confirm-label="${properties['acceptButtonText'] @ i18n}"
        cancel-label="${properties['rejectButtonText'] @ i18n}">

    <div data-sly-test="${asset.properties['license']}"
         data-asset-share-id="license-modal">

        <div style="display: flex;"
             data-sly-list.asset="${license.assets}">

            <sp-asset style="height: 128px">
                <img src="${asset.properties['thumbnail']}" alt="${asset.properties['title']}" />
            </sp-asset>

            <div>
                <iframe data-sly-test="${!wcmmode.disabled && asset.properties['license']}"
                        style="border: solid 1px #ccc"
                        width="100%" height="100%"
                        src="${asset.properties['license']}?wcmmode=disabled"></iframe>

                <iframe data-sly-test="${wcmmode.disabled && asset.properties['license']}"
                        style="border: solid 1px #ccc"
                        width="100%" height="100%"
                        src="${asset.properties['license']}"></iframe>
            </div>
        </div>
    </div>

</sp-dialog-wrapper>
