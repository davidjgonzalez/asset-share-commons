<template data-sly-template.checkbox="${ @ predicate}">
    <sly data-sly-list.option="${predicate.items}">
        <input
                style="display: none;"
                type="checkbox"
                id="${predicate.id}_${optionList.index}"
                form="${predicate.formId}"
                name="${predicate.group}.${optionList.index}_${predicate.name}"
                checked="${option.selected}"
                value="${option.value}"
                data-asset-share-search-on="${predicate.autoSearch ? 'change' : ''}"/>
    </sly>

    <sp-field-group data-sly-list.option="${predicate.items}">
        <sp-checkbox
                size="m"
                checked="${option.selected}"
                disabled="${option.disabled}"
                value="${option.value}"
                data-asset-share-target-input-name="${predicate.group}.${optionList.index}_${predicate.name}"
                onchange="AssetShare.Spectrum.toInput(this)">${option.text}
        </sp-checkbox>
    </sp-field-group>
</template>

<template data-sly-template.switch="${ @ predicate}">
    <sly data-sly-list.option="${predicate.items}">
        <input
                style="display: none;"
                type="checkbox"
                id="${predicate.id}_${optionList.index}"
                form="${predicate.formId}"
                name="${predicate.group}.${optionList.index}_${predicate.name}"
                checked="${option.selected}"
                value="${option.value}"
                data-asset-share-search-on="${predicate.autoSearch ? 'change' : ''}"/>
    </sly>

    <sp-field-group data-sly-list.option="${predicate.items}">
        <sp-switch
                size="m"
                checked="${option.selected}"
                disabled="${option.disabled}"
                value="${option.value}"
                data-asset-share-target-input-name="${predicate.group}.${optionList.index}_${predicate.name}"
                onchange="AssetShare.Spectrum.toInput(this)">${option.text}
        </sp-switch>
    </sp-field-group>
</template>


<!--/* Dropdown Template - renders a dropdown */-->
<template data-sly-template.dropdown="${ @ predicate}">
    <input
            type="hidden"
            name="${predicate.group}.${predicate.name}"
            value="${predicate.intialValue}"
            form="${predicate.formId}"
            for="${predicate.id}"
            data-asset-share-search-on="${predicate.autoSearch ? 'change' : ''}"/>

    <sp-picker style="width: 100%;"
               label="${predicate.title}"
               value="${predicate.intialValue}"
               onchange="AssetShare.Spectrum.toInput(this)"
               data-asset-share-target-input-name="${predicate.group}.${predicate.name}"
               data-sly-list.item="${predicate.items}">
        <sp-menu-item  value="${item.value}">${item.text}</sp-menu-item>
    </sp-picker>
</template>
