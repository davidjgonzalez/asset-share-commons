<!--/* Checkbox Template also renders Radio, Toggle, and Slide formats */-->

<template data-sly-template.checkbox="${ @ predicate}">


    <sly data-sly-list.option="${predicate.items}">
        <input
                style="display: none;"
                type="checkbox"
                for="${predicate.id}"
                id="${predicate.id}_${optionList.index}"
                form="${predicate.formId}"
                name="${predicate.group}.${predicate.name}.${optionList.index}_${predicate.valuesKey}"
                checked="${option.selected}"
                value="${option.value}"
                data-asset-share-search-on="${predicate.autoSearch ? 'change' : ''}"/>
    </sly>

    <sp-field-group
            data-asset-share-id="${predicate.id}__fields"
            data-asset-share-update-method="${predicate.componentUpdateMethod}"
            data-sly-list.option="${predicate.items}">

        <sp-checkbox
                checked="${option.selected}"
                disabled="${option.disabled}"
                value="${option.value}"
                data-asset-share-target-input-name="${predicate.group}.${predicate.name}.${optionList.index}_${predicate.valuesKey}"
                onchange="AssetShare.Spectrum.toInput(this)">${option.text}
        </sp-checkbox>
    </sp-field-group>

</template>

<template data-sly-template.switch="${ @ predicate}">

    <sly data-sly-list.option="${predicate.items}">
        <input
                style="display: none;"
                type="checkbox"
                for="${predicate.id}"
                id="${predicate.id}_${optionList.index}"
                form="${predicate.formId}"
                name="${predicate.group}.${predicate.name}.${optionList.index}_${predicate.valuesKey}"
                checked="${option.selected}"
                value="${option.value}"
                data-asset-share-search-on="${predicate.autoSearch ? 'change' : ''}"/>
    </sly>

    <sp-field-group
            data-asset-share-id="${predicate.id}__fields"
            data-asset-share-update-method="${predicate.componentUpdateMethod}"
            data-sly-list.option="${predicate.items}">
        <sp-switch
                checked="${option.selected}"
                disabled="${option.disabled}"
                value="${option.value}"
                data-asset-share-target-input-name="${predicate.group}.${predicate.name}.${optionList.index}_${predicate.valuesKey}"
                onchange="AssetShare.Spectrum.toInput(this)">${option.text}
        </sp-switch>
    </sp-field-group>

</template>


<template data-sly-template.radio="${ @ predicate}">


    <input
            type="hidden"
            for="${predicate.id}"
            id="${predicate.id}_${optionList.index}"
            form="${predicate.formId}"
            name="${predicate.group}.${predicate.name}.0_${predicate.valuesKey}"
            value="${predicate.initialValue}"
            data-asset-share-search-on="${predicate.autoSearch ? 'change' : ''}"/>

    <sp-radio-group
            selected="${predicate.intialValue}"
            data-asset-share-id="${predicate.id}__fields"
            data-asset-share-update-method="${predicate.componentUpdateMethod}"
            data-sly-list.option="${predicate.items}">

        <sp-radio
                checked="${option.selected}"
                disabled="${option.disabled}"
                value="${option.value}"
                data-asset-share-target-input-name="${predicate.group}.${predicate.name}.0_${predicate.valuesKey}"
                onchange="AssetShare.Spectrum.toInput(this)">${option.text}
        </sp-radio>
    </sp-radio-group>

</template>


<!--/* Dropdown Template - renders a dropdown */-->
<template data-sly-template.dropdown="${ @ predicate}">

    <div class="${predicate.isExpanded ? 'active' : ''} content field">
        <select class="ui fluid dropdown"
                name="${predicate.group}.${predicate.name}.${predicate.valuesKey}"
                value="${predicate.intialValue}"
                form="${predicate.formId}"
                for="${predicate.id}"
                data-asset-share-search-on="${predicate.autoSearch ? 'change' : ''}"
                data-asset-share-id="${predicate.id}__fields"
                data-asset-share-update-method="${predicate.componentUpdateMethod}">
            <option value="">${predicate.title}</option>
            <sly data-sly-list.optionItem="${predicate.items}">
                <option value="${optionItem.value}"
                        disabled="${optionItem.disabled}"
                        selected="${optionItem.selected ? 'selected' : ''}">
                    ${optionItem.text}
                </option>
            </sly>
        </select>
    </div>
</template>
