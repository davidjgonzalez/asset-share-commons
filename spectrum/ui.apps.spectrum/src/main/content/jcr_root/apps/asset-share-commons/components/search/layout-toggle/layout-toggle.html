<!--/* TODO: Make Sling Model so we can mark the active layout */-->

<sp-action-group selects="single"
                 label="${'Search results layout toggle' @ i18n}">

    <sp-action-button
            value="card"
            data-asset-share-id="switch-layout">
        <sp-icon-classic-grid-view slot="icon"></sp-icon-classic-grid-view>
        <sly data-sly-test.showLabels="${properties['showLabels']}">${properties['cardLabel'] @ i18n}</sly>
    </sp-action-button>

    <sp-action-button
            value="list"
            data-asset-share-id="switch-layout">
        <sp-icon-view-list slot="icon"></sp-icon-view-list>
        <sly data-sly-test.showLabels="${showLabels}">${properties['listLabel'] @ i18n}</sly>
    </sp-action-button>

</sp-action-group>
