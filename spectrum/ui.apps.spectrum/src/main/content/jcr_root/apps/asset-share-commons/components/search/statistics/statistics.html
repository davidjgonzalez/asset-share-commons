<sly data-sly-use.placeholderTemplate="core/wcm/components/commons/v1/templates.html"
     data-sly-use.component="com.adobe.aem.commons.assetshare.components.search.Statistics"
     data-sly-test.ready="${component.ready}">

    <div data-asset-share-id="${component.id}__statistics"
         data-asset-share-update-method="replace">
        <!--/* TODO: Determine what to do with time taken; May require removing from Dialog and adding help top to dialog */--->

        <!-- The last search took ${component.timeTaken}ms to complete. -->

        <sp-meter
                style="width: 100%;"
                label="Displaying ${component.runningTotal} of ${component.total}${component.hasMore ? '+' : ''} results"
                progress="${component.percentComplete}">
            <sp-tooltip
                    self-managed
                    placement="bottom">
                This is an estimate of how many total results match the search criteria. The actual number of results
                may be different.
            </sp-tooltip>
        </sp-meter>
    </div>

</sly>
<sly data-sly-call="${placeholderTemplate.placeholder @ isEmpty=!ready}"></sly>
