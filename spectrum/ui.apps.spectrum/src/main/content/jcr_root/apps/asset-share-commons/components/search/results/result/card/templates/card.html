<template data-sly-template.card="${@ asset = result, config = config }">

    <sly data-sly-use.assetDetails="${'com.adobe.aem.commons.assetshare.configuration.AssetDetails' @ request = slingRequest, asset = asset }"></sly>

    <sp-card class="card"
             slot="trigger"
             heading="${asset.properties['title']}"
             subheading="${asset.properties['type']}"
             href="${assetDetails.fullUrl}"
             toggles="true"
             data-asset-share-id="asset"
             data-asset-share-asset="${asset.path}"
             id="${asset.path}">

        <img slot="preview"
             src="${asset.properties['rendition?name=card'] || properties['missingImage'] @ context = 'attribute'}"
             alt="${asset.properties['title']}" decoding="async"/>

        <div slot="footer">${asset.properties['fileSize']}</div>

        <sp-action-menu slot="actions" placement="bottom-end" quiet
                        data-sly-test="${config.downloadEnabled || config.shareEnabled || config.cartEnabled}">
            <sp-menu-item data-sly-test="${config.downloadEnabled}"
                          data-asset-share-id="download-asset"
                          data-asset-share-asset="${asset.path}"
                          data-asset-share-license="${config.licenseEnabled ? asset.properties['license'] : ''}">${'Download' @ i18n}</sp-menu-item>
            <sp-menu-item data-sly-test="${config.shareEnabled}"
                          data-asset-share-id="share-asset"
                          data-asset-share-asset="${asset.path}"
                          data-asset-share-license="${config.licenseEnabled ? asset.properties['license'] : ''}">${'Share' @ i18n}</sp-menu-item>
            <sp-menu-divider data-sly-test="${config.cartEnabled}"></sp-menu-divider>
            <sp-menu-item data-sly-test="${config.cartEnabled}"
                          data-asset-share-id="add-to-cart"
                          data-asset-share-asset="${asset.path}"
                          data-asset-share-license="${config.licenseEnabled ? asset.properties['license'] : ''}">${'Add to Cart' @ i18n}</sp-menu-item>
            <sp-menu-item data-sly-test="${config.cartEnabled}"
                          data-asset-share-id="remove-from-cart"
                          data-asset-share-asset="${asset.path}"
                          data-asset-share-license="${config.licenseEnabled ? asset.properties['license'] : ''}"
                          disabled>${'Remove from Cart' @ i18n}</sp-menu-item>
        </sp-action-menu>
    </sp-card>

</template>
