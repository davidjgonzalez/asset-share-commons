<sly data-sly-use.placeholderTemplate="core/wcm/components/commons/v1/templates.html"
     data-sly-use.togglesTemplate="templates/toggles.html"
     data-sly-use.modelCache="com.adobe.aem.commons.assetshare.util.ModelCache"
     data-sly-set.pagePredicate="${modelCache['com.adobe.aem.commons.assetshare.components.predicates.PagePredicate']}"
     data-sly-set.hideLabels="${properties['hideLabels']}"></sly>

<sp-action-group justified compact
                 data-sly-test.ready="${pagePredicate}">
    <sp-action-button
            label="${properties['applyFilterLabel'] @ i18n}"
            type="submit"
            form="${pagePredicate.formId}">
        <sp-icon-search slot="icon"></sp-icon-search>
        <sly data-sly-test="${!hideLabels}">${properties['applyFilterLabel'] @ i18n}</sly>
    </sp-action-button>

    <sp-action-button
            labe="${properties['resetFilterLabel'] @ i18n}"
            href="${currentPage.path @ extension = 'html'}"
            form="${pagePredicate.formId}">
        <sp-icon-refresh slot="icon"></sp-icon-refresh>
        <sly data-sly-test="${!hideLabels}">${properties['resetFilterLabel'] @ i18n}</sly>
    </sp-action-button>

</sp-action-group>
</div>

<sly data-sly-call="${placeholderTemplate.placeholder @ isEmpty=!ready}"></sly>
