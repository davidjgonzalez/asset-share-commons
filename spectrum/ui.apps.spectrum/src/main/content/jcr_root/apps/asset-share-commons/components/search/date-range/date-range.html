<!--/* Daterange and Relative Daterange predicates  */-->
<sly data-sly-use.placeholderTemplate="core/wcm/components/commons/v1/templates.html"
     data-sly-use.optionsTemplate="templates/options.html"
     data-sly-use.predicate="com.adobe.aem.commons.assetshare.components.predicates.DatePredicate"
     data-sly-test.ready="${predicate.ready}">

    <!--/* Date Property */-->
    <input type="hidden"
           form="${predicate.formId}"
           name="${predicate.group}.${predicate.name}.property"
           value="${predicate.property}"
           data-asset-share-predicate-id="${predicate.id}"/>

    <section class="asc-expandable-section ${predicate.isExpanded ? 'asc-expandable-section--expanded' : ''} ">
        <div class="asc-expandable-section__title">
            <span class="asc-expandable-section__title-arrow">
                <sp-icon-chevron75/>
            </span>
            ${predicate.title}
        </div>
        <div class="asc-expandable-section__content"
             data-asset-share-id="${predicate.id}__fields"
             data-asset-share-update-method="${predicate.componentUpdateMethod}">

            <sly data-sly-test="${predicate.dateType == 'daterange'}"
                 data-sly-call="${optionsTemplate.dateRange @ predicate = predicate}"/>

            <sly data-sly-test="${predicate.dateType == 'relativedaterange'}"
                 data-sly-call="${optionsTemplate.relativeDateRange @ predicate = predicate}"/>
        </div>
    </section>

</sly>
<sly data-sly-call="${placeholderTemplate.placeholder @ isEmpty=!ready}"></sly>
