<template data-sly-template.header="${@ search}">

    <sp-table-head>
        <sp-table-head-cell>Preview</sp-table-head-cell>
        <sp-table-head-cell>${'Name' @i18n}</sp-table-head-cell>
        <sp-table-head-cell>${'Date' @ i18n}</sp-table-head-cell>
        <sp-table-head-cell>${'Res.' @ i18n}</sp-table-head-cell>
        <sp-table-head-cell>${'Size' @ i18n}</sp-table-head-cell>
        <sp-table-head-cell></sp-table-head-cell>
    </sp-table-head>

</template>

<template data-sly-template.row="${@ asset = result, config = config }">

    <sly data-sly-use.assetDetails="${'com.adobe.aem.commons.assetshare.configuration.AssetDetails' @ request = slingRequest, asset = asset }"></sly>

    <sp-table-row data-asset-share-id="asset"
                  data-asset-share-asset="${asset.path}"
                  value="${asset.path}"
                  id="${asset.path}">
        <sp-table-cell>
            <a href="${assetDetails.fullUrl}"><img
                    src="${asset.properties['rendition?name=list'] || properties['missingImage'] @ context = 'attribute'}"
                    width="98px"
                    alt="${asset.properties['title']}"/></a>
        </sp-table-cell>
        <sp-table-cell>
            <a href="${assetDetails.fullUrl}">${asset.properties['title']}</a>
        </sp-table-cell>
        <sp-table-cell>
            ${'yyyy-MM-dd' @ format=asset.properties['jcr:content/jcr:lastModified'], locale=config.locale}
        </sp-table-cell>
        <sp-table-cell>
            <sly data-sly-test="${asset.properties['resolution']}">
                ${asset.properties['resolution']}
            </sly>
        </sp-table-cell>
        <sp-table-cell>
            ${asset.properties['fileSize']}
        </sp-table-cell>
        <sp-table-cell>
            ${'Actions' @ i18n}
        </sp-table-cell>
    </sp-table-row>

</template>


<template data-sly-template.noResults="${@ search = search, config = config }">
    <sp-table-row>
        <sp-table-cell colspan="7" style="text-align: center;">
            <h1 style="margin: 2rem auto;">
                ${properties['noResultsText'] || 'No results could be found' @ i18n}
            </h1>
        </sp-table-cell>
    </sp-table-row>
</template>
