<template data-sly-template.card="${@ asset = result, config = config }">

    <sly data-sly-use.assetDetails="${'com.adobe.aem.commons.assetshare.configuration.AssetDetails' @ request = slingRequest, asset = asset }"></sly>

    <sp-card class="card"
             heading="${asset.properties['title']}"
             subheading="${asset.properties['type']}"
             href="${assetDetails.fullUrl}"
             toggles="true"
             data-asset-share-id="asset"
             data-asset-share-asset="${asset.path}"
             id="${asset.path}">

        <img slot="preview"
             src="${asset.properties['rendition?name=card'] || properties['missingImage'] @ context = 'attribute'}"
             alt="${asset.properties['title']}" decoding="async"/>

        <div slot="footer">${asset.properties['fileSize']}</div>
    </sp-card>

</template>
