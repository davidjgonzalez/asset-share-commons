<sly data-sly-use.placeholderTemplate="core/wcm/components/commons/v1/templates.html"
     data-sly-use.predicate="com.adobe.aem.commons.assetshare.components.predicates.SortPredicate"
     data-sly-test.ready="${predicate.ready}">

    <input
            type="hidden"
            name="orderby.case"
            form="${predicate.formId}"
            value="${predicate.initialValues['case']}"
            data-asset-share-id="sort"
            data-asset-share-search-actions="all"/>

    <input
            type="hidden"
            name="orderby"
            value="${predicate.initialValues['orderby']}"
            form="${predicate.formId}"
            data-asset-share-id="sort"
            data-asset-share-search-actions="all"
            data-asset-share-search-on="${predicate.autoSearch ? 'change' : ''}"/>

    <input
            type="hidden"
            name="orderby.sort"
            value="${predicate.initialValues['sort']}"
            form="${predicate.formId}"
            data-asset-share-id="sort"
            data-asset-share-search-actions="all"
            data-asset-share-search-on="${predicate.autoSearch ? 'change' : ''}"/>

    <sp-picker id="picker-m" size="m"
               label="${predicate.orderByLabel}"
               value="${predicate.initialValues['orderby']}"
               onchange="AssetShare.Spectrum.toInput(this)"
               data-asset-share-target-input-name="orderby"
               data-sly-list.item="${predicate.items}">
        <sp-menu-item
                value="${item.value}"
                data-asset-share-sort-case-sensitive="${item.caseSensitive}">${item.text}
        </sp-menu-item>
    </sp-picker>


    <sp-picker id="picker-m" size="m"
               label="${predicate.orderBySortLabel}"
               value="${predicate.initialValues['orderby.sort']}"
               onchange="AssetShare.Spectrum.toInput(this)"
               data-asset-share-target-input-name="orderby.sort">
        <sp-menu-item
                value="asc"
                data-asset-share-sort-case-sensitive="${item.caseSensitive}">${properties['ascendingLabel'] @ i18n}
        </sp-menu-item>
        <sp-menu-item
                value="desc"
                data-asset-share-sort-case-sensitive="${item.caseSensitive}">${properties['descendingLabel'] @ i18n}
        </sp-menu-item>
    </sp-picker>

    <br/>
    <br/>

</sly>
<sly data-sly-call="${placeholderTemplate.placeholder @ isEmpty=!ready}"></sly>
